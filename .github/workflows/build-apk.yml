name: Build APK

# Läuft automatisch, sobald du eine ZIP-Datei (oder Code) ins Repository hochlädst.
on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quelle finden (neueste ZIP oder Repo-Inhalt)
        id: src
        run: |
          set -e
          best=""; bestt=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -ge "$bestt" ]; then bestt=$t; best=$f; fi
          done < <(git ls-files '*.zip')

          if [ -n "$best" ]; then
            echo "Verwende ZIP: $best"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$best" -d "$RUNNER_TEMP/src"
            pj=$(find "$RUNNER_TEMP/src" -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)
            [ -z "$pj" ] && { echo "::error::In der ZIP wurde keine package.json gefunden."; exit 1; }
            echo "dir=$(dirname "$pj")" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then
            echo "Keine ZIP gefunden – verwende Repo-Inhalt."
            echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Keine ZIP und keine package.json im Repository."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        working-directory: ${{ steps.src.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          [ -d android ] || npx cap add android
          # Native Brücke für dynamische Farben (Material You) einsetzen
          if [ -d android-overlay ]; then
            D=android/app/src/main/java/com/nutrisnap/app
            mkdir -p "$D"
            cp android-overlay/*.java "$D"/
          fi
          # Kamera-Berechtigung ergänzen
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$M"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          fi
          npx cap sync android

      - name: Feste Signatur + Versionsnummer setzen
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          if [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore android/app/nutrisnap.keystore
            {
              echo ""
              echo "android {"
              echo "  signingConfigs {"
              echo "    debug {"
              echo "      storeFile file('nutrisnap.keystore')"
              echo "      storePassword 'android'"
              echo "      keyAlias 'androiddebugkey'"
              echo "      keyPassword 'android'"
              echo "    }"
              echo "  }"
              echo "}"
            } >> "$G"
          fi

      - name: Maven-Spiegel einrichten (gegen 429-Fehler)
        run: |
          mkdir -p ~/.gradle/init.d
          M='maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
          {
            echo "allprojects {"
            echo "  buildscript { repositories { $M } }"
            echo "  repositories { $M }"
            echo "}"
          } > ~/.gradle/init.d/mirror.gradle

      - name: APK bauen (mit Wiederholung)
        working-directory: ${{ steps.src.outputs.dir }}/android
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do
            if ./gradlew assembleDebug --no-daemon; then exit 0; fi
            echo "Versuch $i fehlgeschlagen – warte und probiere es erneut …"
            sleep $((i * 40))
          done
          exit 1

      - name: APK umbenennen
        run: |
          cp "${{ steps.src.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/NutriSnap-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NutriSnap-APK
          path: ${{ runner.temp }}/NutriSnap-${{ github.run_number }}.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NutriSnap Build ${{ github.run_number }}
          body: Direkt-Download der APK. Auf dem Handy öffnen, herunterladen und installieren.
          files: ${{ runner.temp }}/NutriSnap-${{ github.run_number }}.apk
